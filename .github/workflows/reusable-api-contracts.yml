# .github/workflows/reusable-api-contracts.yml
#
# Reusable workflow for API-first repositories (e.g., wendara-api-definitions).
# It validates OpenAPI contracts, enforces semantic versioning with an OAS diff guard,
# optionally generates Redoc HTML previews, publishes only CHANGED APIs as artifacts
# to BOTH distribution channels (Maven + npm), and after a stable release on main,
# syncs main → develop (push history merge if no changes, otherwise PR).
#
# Inputs (set by the caller workflow):
#   - java_version: string (default "21")         -> Java toolchain for Gradle tasks (Maven publishing)
#   - node_version: string (default "22")         -> Node.js version for Redoc/linters + npm publishing
#   - run_redoc: boolean (default true)           -> Build Redoc previews if true
#   - publish_enabled: boolean (default false)    -> Publish artifacts if true (use on push, not on PR)
#   - require_listed_only: boolean (default true) -> If true, only APIs present in root metadata.yml are eligible
#
# Secrets (provided by the caller):
#   - PACKAGES_TOKEN -> Token with packages:write (usually the caller's GITHUB_TOKEN)
#
# Outputs:
#   - changed_specs: space-separated list of changed openapi.yaml paths
#   - any_changed: "true"/"false"
#   - released: "true"/"false" (true only when publishing on main AND at least one artifact was published)
#   - release_channel: "RELEASE"|"SNAPSHOT" (derived from branch name; main => RELEASE)
#
# Notes:
# - This workflow assumes the consumer repo has:
#     apis/<apiName>/<transport>/<apiVersion>/openapi.yaml
#     (optional) per-API metadata.yml next to each spec
#     (optional) root metadata.yml at repo root (whitelist index)
#     (optional) .redocly.yaml at repo root
# - Publishing channels:
#     1) Maven (GitHub Packages Maven Registry): zip contracts (Gradle-driven from consumer repo)
#     2) npm   (GitHub Packages npm Registry):  contracts package (script-driven from ci-actions)
# - External dependencies required by some steps:
#     - oasdiff (CLI binary, installed in the runner)
#     - yq (mikefarah, for YAML parsing)
#     - reviewdog (for PR annotations)
#
# Jobs Overview:
#   - detect: Detects changed OpenAPI specs and metadata.
#   - validate: Lints specs and checks Conventional Commits.
#   - guard: Enforces semantic versioning using oasdiff.
#   - redoc: Optionally builds Redoc HTML previews for changed specs.
#   - publish_maven: Publishes changed specs as Maven artifacts (zip) to GitHub Packages.
#   - publish_npm: Publishes changed specs as npm packages to GitHub Packages.
#   - release_gate: Single source of truth for outputs (released + release_channel).
#   - sync: After stable publish, syncs main → develop.

name: Reusable · API Contracts

on:
  workflow_call:
    inputs:
      java_version:
        description: "Java version for Gradle"
        required: false
        default: "21"
        type: string
      node_version:
        description: "Node version for Redoc/linters"
        required: false
        default: "22"
        type: string
      run_redoc:
        description: "Generate Redoc HTML previews"
        required: false
        default: true
        type: boolean
      publish_enabled:
        description: "Publish artifacts (use on push, not PR)"
        required: false
        default: false
        type: boolean
      require_listed_only:
        description: "Only consider APIs listed in root metadata.yml"
        required: false
        default: true
        type: boolean
    secrets:
      PACKAGES_TOKEN:
        required: false
    outputs:
      changed_specs:
        description: "Space-separated list of changed openapi.yaml paths"
        value: ${{ jobs.detect.outputs.changed_specs }}
      any_changed:
        description: "Whether any OpenAPI spec changed"
        value: ${{ jobs.detect.outputs.any_changed }}
      released:
        description: "Whether we published a stable release on main"
        value: ${{ jobs.release_gate.outputs.released }}
      release_channel:
        description: "Derived release channel (RELEASE on main, SNAPSHOT otherwise)"
        value: ${{ jobs.release_gate.outputs.release_channel }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:

  detect:
    # Detect which OpenAPI specs changed in this push/PR.
    # Output is a space-separated list of: apis/*/*/*/openapi.yaml
    name: Detect changed API specs
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      changed_specs: ${{ steps.collect.outputs.changed_specs }}
      any_changed: ${{ steps.collect.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files (specs + per-API metadata + root metadata + redoc config)
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            apis/*/*/*/openapi.yaml
            apis/*/*/*/metadata.yml
            metadata.yml
            .redocly.yaml

      - name: Install yq (for version bump detection)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Collect changed specs (no root expansion, only version-bumped per-API metadata)
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n'

          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
          HEAD_REF="${{ github.sha }}"

          # 1) Gather directly changed specs
          DIRECT_SPECS=()
          for f in ${{ steps.changed.outputs.all_changed_files }}; do
            if [[ "$f" == apis/*/*/*/openapi.yaml ]]; then
              DIRECT_SPECS+=("$f")
            fi
          done

          # 2) Per-API metadata.yml changes:
          #    Include the spec ONLY if openapi.info.version changed between BASE and HEAD.
          #    This keeps version source-of-truth aligned with OpenAPI (not metadata), while still supporting
          #    "bump-by-metadata-change" scenarios where maintainers update version without editing openapi.yaml.
          VERSION_BUMP_SPECS=()
          for meta in ${{ steps.changed.outputs.all_changed_files }}; do
            if [[ "$meta" == apis/*/*/*/metadata.yml ]]; then
              api_dir="$(dirname "$meta")"
              spec="${api_dir}/openapi.yaml"

              if [[ -f "$spec" ]]; then
                old_ver="$(git show "${BASE_REF}:${spec}" 2>/dev/null | yq e -r '.info.version // ""' - 2>/dev/null || true)"
                new_ver="$(yq e -r '.info.version // ""' "$spec" 2>/dev/null || true)"

                if [[ -n "$old_ver" && -n "$new_ver" && "$old_ver" != "$new_ver" ]]; then
                  VERSION_BUMP_SPECS+=("$spec")
                fi
              fi
            fi
          done

          # 3) Root metadata.yml changes MUST NOT expand all specs.
          #    Root index affects whitelist, but should not force republish by itself.

          # Merge and deduplicate
          ALL=("${DIRECT_SPECS[@]}" "${VERSION_BUMP_SPECS[@]}")
          if [[ ${#ALL[@]} -eq 0 ]]; then
            echo "changed_specs=" >> $GITHUB_OUTPUT
            echo "any_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          mapfile -t UNIQUE < <(printf "%s\n" "${ALL[@]}" | sort -u)
          CHANGED_SPECS="$(printf "%s " "${UNIQUE[@]}")"

          echo "Changed specs (post-filter):"
          printf "  - %s\n" "${UNIQUE[@]}"

          echo "changed_specs=${CHANGED_SPECS}" >> $GITHUB_OUTPUT
          echo "any_changed=true" >> $GITHUB_OUTPUT

  validate:
    # Lint OpenAPI specs with Redocly CLI and enforce Conventional Commits (PR only).
    name: Lint + Conventional Commits
    runs-on: ubuntu-latest
    needs: [ detect ]
    if: needs.detect.outputs.any_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional Commits check (PRs only). No local hooks required.
      - name: Commitlint (Conventional Commits)
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Redocly CLI
        run: npm i -g @redocly/cli

      - name: Redocly lint (all changed specs)
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n'
          for spec in ${{ needs.detect.outputs.changed_specs }}; do
            [ -z "$spec" ] && continue
            echo "Linting '${spec}'"
            redocly lint "$spec"
          done

  guard:
    # Semantic diff guard (oasdiff): validates semantic version bump vs API diff.
    name: Semantic diff guard (oasdiff)
    runs-on: ubuntu-latest
    needs: [ detect ]
    if: needs.detect.outputs.any_changed == 'true'
    # Explicit permissions for reviewdog annotations inside reusable workflow.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # Pass token so reviewdog can publish PR checks from reusable workflow.
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout consumer repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ci-actions (scripts)
        uses: actions/checkout@v4
        with:
          repository: wendara-org/wendara-ci-actions
          path: .wendara-ci-actions
          ref: main

      - name: Make scripts executable
        run: chmod -R +x .wendara-ci-actions/scripts

      - name: Install yq & reviewdog
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin

      - name: Install oasdiff (pinned, with fallback)
        run: |
          set -euo pipefail
          VERSION="v1.11.7"
          TMP="$(mktemp -d)"
          cd "$TMP"

          # Attempt direct asset first (fast path)
          if curl -fsSL -o oasdiff "https://github.com/oasdiff/oasdiff/releases/download/${VERSION}/oasdiff-linux-amd64"; then
            chmod +x oasdiff || true
            BIN="./oasdiff"
          else
            echo "Direct asset missing; using official installer..."
            curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh -s -- -b . "${VERSION}"
            BIN="./oasdiff"
            if ! [ -x "$BIN" ]; then
              BIN="/usr/local/bin/oasdiff"
            fi
          fi

          # Final validation
          if ! [ -x "$BIN" ]; then
            echo "oasdiff not found at ${BIN}"
            exit 127
          fi
          file "$BIN" | grep -qi 'ELF' || { echo "Invalid oasdiff binary"; exit 127; }

          # Ensure it's available in PATH
          if [ "$BIN" != "/usr/local/bin/oasdiff" ]; then
            sudo install -m 0755 "$BIN" /usr/local/bin/oasdiff
          fi
          /usr/local/bin/oasdiff --version

      - name: Run semantic guard (per spec)
        env:
          CHANGED_SPECS: ${{ needs.detect.outputs.changed_specs }}
        run: |
          set -euo pipefail
          read -r -a SPECS <<< "${CHANGED_SPECS}"
          for spec in "${SPECS[@]}"; do
            [ -z "$spec" ] && continue
            echo "Running semantic diff for '${spec}'"
            .wendara-ci-actions/scripts/api-first/api-oasdiff-guard.sh origin/main HEAD "$spec"
          done

      - name: Generate API changelog (oasdiff)
        run: |
          chmod +x .wendara-ci-actions/scripts/api-first/oasdiff-changelog.sh
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
          HEAD_REF="${{ github.sha }}"
          .wendara-ci-actions/scripts/api-first/oasdiff-changelog.sh "$BASE_REF" "$HEAD_REF" CHANGELOG.md

      - name: Show changelog in logs
        if: always()
        run: |
          echo "==================== CHANGELOG.md ===================="
          cat CHANGELOG.md || echo "No changelog file generated."
          echo "======================================================"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-changelog
          path: CHANGELOG.md
          retention-days: 7

  redoc:
    # Optional Redoc HTML previews for changed specs (reviewer-friendly artifacts).
    name: Build Redoc previews
    runs-on: ubuntu-latest
    needs: [ detect ]
    if: needs.detect.outputs.any_changed == 'true' && inputs.run_redoc
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ci-actions (to get scripts)
        uses: actions/checkout@v4
        with:
          repository: wendara-org/wendara-ci-actions
          path: .wendara-ci-actions
          ref: main

      - name: Make scripts executable
        run: chmod -R +x .wendara-ci-actions/scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Redocly CLI
        run: npm i -g @redocly/cli

      - name: Build Redoc HTML previews (per spec)
        run: |
          set -euo pipefail
          mkdir -p redoc-previews
          read -r -a SPECS <<< "${{ needs.detect.outputs.changed_specs }}"
          for spec in "${SPECS[@]}"; do
            [ -z "$spec" ] && continue
            api_dir="$(dirname "$spec")"
            api_name="$(echo "$api_dir" | tr '/' '-')"
            out_html="redoc-previews/${api_name}.html"
            .wendara-ci-actions/scripts/api-first/redoc-build.sh "$spec" "$out_html"
            echo "Generated: '$out_html'"
          done

      - name: Upload Redoc previews
        uses: actions/upload-artifact@v4
        with:
          name: redoc-previews
          path: redoc-previews/
          retention-days: 7

  publish_maven:
    # Publishes changed specs as Maven artifacts (zip) via consumer repo Gradle build.
    # We pre-filter (best-effort) to avoid GH Packages 409 conflicts (already published).
    name: Publish contracts to GitHub Packages (maven)
    runs-on: ubuntu-latest
    needs: [ detect, validate, guard ]
    if: needs.detect.outputs.any_changed == 'true' && inputs.publish_enabled
    outputs:
      published_any: ${{ steps.filter.outputs.published_any }}
      release_channel: ${{ steps.channel.outputs.value }}
    steps:
      - name: Checkout consumer repo (api-definitions)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq (required by Gradle build + filtering)
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Setup Java (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Derive release channel (branch-driven)
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "value=RELEASE" >> $GITHUB_OUTPUT
          else
            echo "value=SNAPSHOT" >> $GITHUB_OUTPUT
          fi

      - name: Resolve publish list (best-effort skip of already-published Maven artifacts)
        id: filter
        env:
          CHANGED_SPECS: ${{ needs.detect.outputs.changed_specs }}
          REQUIRE_LISTED_ONLY: ${{ inputs.require_listed_only }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.value }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a SPECS <<< "${CHANGED_SPECS}"
          ROOT_META="metadata.yml"

          # Build whitelist from root metadata.yml (by exact spec path)
          # Root format (current):
          #   apis:
          #     - definition-path: apis/<...>/openapi.yaml
          declare -A WHITE=()
          if [[ "${REQUIRE_LISTED_ONLY}" == "true" && -f "${ROOT_META}" ]]; then
            while IFS= read -r p; do
              [[ -n "$p" ]] && WHITE["$p"]=1
            done < <(yq e -r '.apis[]."definition-path"' "${ROOT_META}" 2>/dev/null || true)
          fi

          must_publish() {
            local spec="$1"
            local dir; dir="$(dirname "$spec")"
            local meta="${dir}/metadata.yml"

            # Respect whitelist if enabled AND root index is present
            if [[ "${REQUIRE_LISTED_ONLY}" == "true" && ${#WHITE[@]} -gt 0 ]]; then
              if [[ -z "${WHITE[$spec]:-}" ]]; then
                echo "skip: not listed -> ${spec}" >&2
                return 1
              fi
            fi

            # Per-API metadata schema fallback:
            #  - Current schema: .api.publish / .api.groupId / .api.artifactId
            #  - Legacy schema:  .publish / .groupId / .artifactId
            local publish="true"
            local groupId="" artifactId=""
            if [[ -f "$meta" ]]; then
              publish="$(yq e -r '.api.publish // .publish // true' "$meta" 2>/dev/null || echo true)"
              groupId="$(yq e -r '.api.groupId // .groupId // ""' "$meta" 2>/dev/null || echo "")"
              artifactId="$(yq e -r '.api.artifactId // .artifactId // ""' "$meta" 2>/dev/null || echo "")"
            fi

            if [[ "${publish}" != "true" ]]; then
              echo "skip: publish=false -> ${spec}" >&2
              return 1
            fi

            # Version source of truth is info.version (same as Gradle)
            local baseVersion
            baseVersion="$(yq e -r '.info.version // ""' "$spec" 2>/dev/null || true)"
            if [[ -z "$baseVersion" ]]; then
              echo "no-check: missing info.version -> ${spec}" >&2
              return 0
            fi

            local version="$baseVersion"
            if [[ "${RELEASE_CHANNEL}" == "SNAPSHOT" && "$version" != *"-SNAPSHOT" ]]; then
              version="${version}-SNAPSHOT"
            fi

            # If coords are missing, we cannot HEAD-check; defer to Gradle (it will compute defaults from path)
            if [[ -z "$groupId" || -z "$artifactId" ]]; then
              echo "no-check: missing coords -> ${spec}" >&2
              return 0
            fi

            # HEAD check against GH Packages Maven registry: if 200 -> artifact exists -> skip
            local repo="https://maven.pkg.github.com/wendara-org/wendara-api-definitions"
            local groupPath="${groupId//./\/}"
            local url="${repo}/${groupPath}/${artifactId}/${version}/${artifactId}-${version}.zip"

            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -I \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url" || true)

            if [[ "$code" == "200" ]]; then
              echo "skip: exists (409 avoided) -> ${spec}" >&2
              return 1
            fi

            return 0
          }

          FILTERED=()
          for spec in "${SPECS[@]}"; do
            [[ -z "$spec" ]] && continue
            if must_publish "$spec"; then
              FILTERED+=("$spec")
            fi
          done

          if [[ ${#FILTERED[@]} -eq 0 ]]; then
            echo "filtered_specs=" >> $GITHUB_OUTPUT
            echo "published_any=false" >> $GITHUB_OUTPUT
            echo "Nothing to publish after filtering."
          else
            FILTERED_SPECS="$(printf "%s " "${FILTERED[@]}")"
            echo "filtered_specs=${FILTERED_SPECS}" >> $GITHUB_OUTPUT
            echo "published_any=true" >> $GITHUB_OUTPUT
            printf "Will publish (maven):\n  - %s\n" "${FILTERED[@]}"
          fi

      - name: Publish (Gradle publishChangedSpecs)
        if: steps.filter.outputs.filtered_specs != ''
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: |
          CHANGED="$(echo '${{ steps.filter.outputs.filtered_specs }}' | xargs)"
          ./gradlew --no-daemon --no-configuration-cache \
            publishChangedSpecs \
            -PchangedSpecs="$CHANGED" \
            -PreleaseChannel="${{ steps.channel.outputs.value }}" \
            -PrequireListedOnly="${{ inputs.require_listed_only }}"

  publish_npm:
    # Publishes changed specs as npm packages via ci-actions script.
    # The script is responsible for:
    #  - Naming equivalence with Maven artifactId (per-API metadata.yml)
    #  - Stable version on RELEASE
    #  - Unique version on SNAPSHOT (no collisions)
    #  - Skipping if version already exists (immutability)
    name: Publish contracts to GitHub Packages (npm)
    runs-on: ubuntu-latest
    needs: [ detect, validate, guard ]
    if: needs.detect.outputs.any_changed == 'true' && inputs.publish_enabled
    outputs:
      published_any: ${{ steps.published.outputs.published_any }}
      release_channel: ${{ steps.channel.outputs.value }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout consumer repo (api-definitions)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ci-actions (scripts)
        uses: actions/checkout@v4
        with:
          repository: wendara-org/wendara-ci-actions
          path: .wendara-ci-actions
          ref: main

      - name: Make scripts executable
        run: chmod -R +x .wendara-ci-actions/scripts

      - name: Install yq (required by npm publish script)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Setup Node (GitHub Packages npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://npm.pkg.github.com
          scope: "@wendara-org"

      - name: Derive release channel (branch-driven)
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "value=RELEASE" >> $GITHUB_OUTPUT
          else
            echo "value=SNAPSHOT" >> $GITHUB_OUTPUT
          fi

      - name: Resolve publish list (npm)
        id: filter
        env:
          CHANGED_SPECS: ${{ needs.detect.outputs.changed_specs }}
          REQUIRE_LISTED_ONLY: ${{ inputs.require_listed_only }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a SPECS <<< "${CHANGED_SPECS}"
          ROOT_META="metadata.yml"

          # Root whitelist (same semantics as Maven path filtering)
          declare -A WHITE=()
          if [[ "${REQUIRE_LISTED_ONLY}" == "true" && -f "${ROOT_META}" ]]; then
            while IFS= read -r p; do
              [[ -n "$p" ]] && WHITE["$p"]=1
            done < <(yq e -r '.apis[]."definition-path"' "${ROOT_META}" 2>/dev/null || true)
          fi

          must_publish() {
            local spec="$1"
            local dir; dir="$(dirname "$spec")"
            local meta="${dir}/metadata.yml"

            if [[ "${REQUIRE_LISTED_ONLY}" == "true" && ${#WHITE[@]} -gt 0 ]]; then
              if [[ -z "${WHITE[$spec]:-}" ]]; then
                echo "skip: not listed -> ${spec}" >&2
                return 1
              fi
            fi

            # Per-API publish flag with schema fallback
            local publish="true"
            if [[ -f "$meta" ]]; then
              publish="$(yq e -r '.api.publish // .publish // true' "$meta" 2>/dev/null || echo true)"
            fi

            if [[ "${publish}" != "true" ]]; then
              echo "skip: publish=false -> ${spec}" >&2
              return 1
            fi

            return 0
          }

          FILTERED=()
          for spec in "${SPECS[@]}"; do
            [[ -z "$spec" ]] && continue
            if must_publish "$spec"; then
              FILTERED+=("$spec")
            fi
          done

          if [[ ${#FILTERED[@]} -eq 0 ]]; then
            echo "filtered_specs=" >> $GITHUB_OUTPUT
            echo "published_any=false" >> $GITHUB_OUTPUT
            echo "Nothing to publish after filtering."
          else
            FILTERED_SPECS="$(printf "%s " "${FILTERED[@]}")"
            echo "filtered_specs=${FILTERED_SPECS}" >> $GITHUB_OUTPUT
            echo "published_any=true" >> $GITHUB_OUTPUT
            printf "Will publish (npm):\n  - %s\n" "${FILTERED[@]}"
          fi

      - name: Publish (npm packages via script)
        if: steps.filter.outputs.filtered_specs != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a SPECS <<< "$(echo '${{ steps.filter.outputs.filtered_specs }}' | xargs)"

          for spec in "${SPECS[@]}"; do
            [ -z "$spec" ] && continue
            .wendara-ci-actions/scripts/api-first/npm-publish-contracts.sh "$spec" "${RELEASE_CHANNEL}"
          done

      - name: Surface publish outputs
        id: published
        shell: bash
        run: |
          # publish_any comes from filter (not from npm itself)
          if [[ "${{ steps.filter.outputs.published_any }}" == "true" ]]; then
            echo "published_any=true" >> $GITHUB_OUTPUT
          else
            echo "published_any=false" >> $GITHUB_OUTPUT
          fi

  release_gate:
    # Single source of truth for reusable workflow outputs:
    # - released: only true on main AND something was published (maven OR npm)
    # - release_channel: derived from branch name
    name: Release gate
    runs-on: ubuntu-latest
    needs: [ publish_maven, publish_npm ]
    if: always()
    outputs:
      released: ${{ steps.flag.outputs.released }}
      release_channel: ${{ steps.flag.outputs.release_channel }}
    steps:
      - name: Flag outputs
        id: flag
        shell: bash
        run: |
          MAVEN_PUBLISHED="${{ needs.publish_maven.outputs.published_any }}"
          NPM_PUBLISHED="${{ needs.publish_npm.outputs.published_any }}"

          MAVEN_PUBLISHED="${MAVEN_PUBLISHED:-false}"
          NPM_PUBLISHED="${NPM_PUBLISHED:-false}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "release_channel=RELEASE" >> $GITHUB_OUTPUT
          else
            echo "release_channel=SNAPSHOT" >> $GITHUB_OUTPUT
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" && ( "${MAVEN_PUBLISHED}" == "true" || "${NPM_PUBLISHED}" == "true" ) ]]; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  sync:
    # Sync main → develop after a stable publish on main.
    # Strategy:
    # - Create a branch off develop.
    # - Merge main using "ours" strategy to advance history without changing content.
    # - If tree changed, create a PR; otherwise push directly to develop.
    name: Sync main → develop
    runs-on: ubuntu-latest
    needs: [ release_gate ]
    if: needs.release_gate.outputs.released == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch and merge
        id: merge
        run: |
          git fetch origin main develop
          git checkout -b chore/sync-main-into-develop origin/develop

          # Create a history-only merge commit
          git merge -s ours --no-ff origin/main -m "chore(sync): record main tip in develop history"

          # Determine whether there are actual content changes
          if git diff-tree --quiet origin/develop HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push directly to develop (history sync only)
        if: steps.merge.outputs.has_changes == 'false'
        run: |
          git push origin HEAD:develop

      - name: Create PR (when there are content changes)
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: |
          git push -f origin chore/sync-main-into-develop

          existing_pr=$(gh pr list --head chore/sync-main-into-develop --base develop --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            echo "✅ PR #$existing_pr already exists"
          else
            gh pr create \
              --base develop \
              --head chore/sync-main-into-develop \
              --title "chore(sync): merge main into develop" \
              --body "$(cat <<EOF
          ## 🔄 Sync main → develop

          Automated PR to merge changes from **main** back into **develop** after release.

          ⚠️ This PR contains actual content changes that need review.

          **Source:** \`main\`
          **Target:** \`develop\`
          EOF
              )" \
              --label chore \
              --label sync
          fi

      - name: Summary
        if: always()
        run: |
          echo "✅ release_gate.released=${{ needs.release_gate.outputs.released }}"
          echo "✅ release_gate.release_channel=${{ needs.release_gate.outputs.release_channel }}"
          echo "✅ sync.has_changes=${{ steps.merge.outputs.has_changes }}"

          if [ "${{ steps.merge.outputs.has_changes }}" == "false" ]; then
            echo "✅ Pushed merge commit directly to develop (history sync only)"
          else
            echo "📝 Created PR with content changes for review"
          fi
